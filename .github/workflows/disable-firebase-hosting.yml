name: Disable unused Firebase Hosting site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIRTALAL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_MIRTALAL repository secret." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"

      - name: Disable the mirtalal Firebase Hosting site
        run: |
          npm install --global firebase-tools
          firebase hosting:disable --project mirtalal --site mirtalal --force
